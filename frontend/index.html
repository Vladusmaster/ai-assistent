<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | РЭУ им. Г.В. Плеханова</title>
    <!-- Подключаем отдельный файл со стилями -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-bar">
    <!-- ... весь верхний блок ... -->
</div>

<div class="header">
    <!-- ... шапка РЭУ ... -->
</div>

<div class="main-container">
    <div class="sidebar">
        <!-- ... боковое меню ... -->
    </div>

    <div class="content-area">
        <div class="page-title">Интеллектуальный помощник по базам данных</div>
        
        <div class="chat-container">
            <div class="chat-history" id="chatHistory">
                <div class="message bot-msg">Привет! Я встроенный AI-ассистент. Какой у вас вопрос?</div>
            </div>
            
            <div class="loader" id="loader">Ассистент обрабатывает запрос...</div>
            
            <div class="input-group">
                <input type="text" id="userInput" placeholder="Например: Покажи всех студентов из таблицы students" onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>
</div>

<!-- Подключаем отдельный файл с логикой в самом конце -->
<script src="js/script.js"></script>

</body>
</html>
